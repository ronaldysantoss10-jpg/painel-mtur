<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Executivo de Monitoramento - MTur</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS para ler e gerar Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .uf-path {
      transition: all 0.3s ease-in-out;
      cursor: pointer;
    }
    .uf-path:hover {
      fill: #38bdf8 !important;
      fill-opacity: 1 !important;
      stroke: #ffffff !important;
      stroke-width: 2px;
      filter: drop-shadow(0px 0px 8px rgba(56, 189, 248, 0.9));
    }
    .uf-path.selected {
      fill: #10b981 !important;
      fill-opacity: 1 !important;
      stroke: #ffffff !important;
      stroke-width: 2.5px;
      filter: drop-shadow(0px 0px 12px rgba(16, 185, 129, 0.95));
    }
    .uf-path.dimmed {
      opacity: 0.25 !important;
    }
    .uf-label {
      font-size: 8px;
      font-weight: 800;
      fill: #f8fafc;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
      text-shadow: 0px 1px 3px rgba(0,0,0,0.9);
    }

    /* --- ESTILOS EXCLUSIVOS DE IMPRESSÃO --- */
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      
      body {
        background-color: white !important;
        color: black !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .no-print {
        display: none !important;
      }

      .print-hide-col {
        display: none !important;
      }

      .print-page-break-before {
        break-before: page !important;
        page-break-before: always !important;
      }

      .print-card, 
      tr, 
      header,
      .grid > div {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      body.modal-open #root > div > *:not(#print-modal-container) {
        display: none !important;
      }

      #print-modal-container {
        position: static !important;
        width: 100% !important;
        box-shadow: none !important;
        border: none !important;
        background: white !important;
        color: black !important;
      }

      .bg-slate-900, .bg-slate-950, .bg-slate-800, .bg-white, .bg-slate-100 {
        background-color: #ffffff !important;
        background-image: none !important;
        color: black !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }

      text, th, td, h1, h2, h3, p, span, div {
        color: black !important;
      }

      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }

      th, td {
        border-bottom: 1px solid #cbd5e1 !important;
        padding: 5px !important;
      }

      thead {
        display: table-header-group !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const fmtR$ = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);

    const dynamicCenterTotalPlugin = {
      id: 'dynamicCenterTotal',
      beforeDraw(chart) {
        if (chart.config.type !== 'doughnut' && chart.config.type !== 'pie') return;

        const { ctx, chartArea } = chart;
        const dataset = chart.data.datasets[0];
        if (!dataset) return;

        const meta = chart.getDatasetMeta(0);
        
        const totalVisivel = dataset.data.reduce((acc, val, i) => {
          const isHidden = meta.data[i] && meta.data[i].hidden;
          return !isHidden ? acc + (val || 0) : acc;
        }, 0);

        ctx.save();
        const centerX = (chartArea.left + chartArea.right) / 2;
        const centerY = (chartArea.top + chartArea.bottom) / 2 - 5;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillStyle = chart.options.plugins.centerTextColor || '#94a3b8';
        ctx.fillText('TOTAL REAL', centerX, centerY - 10);

        ctx.font = 'bold 12px sans-serif';
        ctx.fillStyle = chart.options.plugins.centerValueColor || '#38bdf8';
        ctx.fillText(fmtR$(totalVisivel), centerX, centerY + 8);
        ctx.restore();
      }
    };

    Chart.register(dynamicCenterTotalPlugin);

    const formatMillionsAxis = (val) => {
      if (val === 0 || !val) return '0';
      const mill = val / 1000000;
      return mill >= 1 ? `${mill.toFixed(1)}M` : `${(val / 1000).toFixed(0)}k`;
    };

    const BrazilMapSVG = ({ selectedUFs, onToggleUF, ufData, isModal = false, isLightMode = false }) => {
      const ufNames = {
        AC: "Acre", AL: "Alagoas", AM: "Amazonas", AP: "Amapá", BA: "Bahia",
        CE: "Ceará", DF: "Distrito Federal", ES: "Espírito Santo", GO: "Goiás",
        MA: "Maranhão", MG: "Minas Gerais", MS: "Mato Grosso do Sul", MT: "Mato Grosso",
        PA: "Pará", PB: "Paraíba", PE: "Pernambuco", PI: "Piauí", PR: "Paraná",
        RJ: "Rio de Janeiro", RN: "Rio Grande do Norte", RO: "Rondônia", RR: "Roraima",
        RS: "Rio Grande do Sul", SC: "Santa Catarina", SE: "Sergipe", SP: "São Paulo", TO: "Tocantins"
      };

      const ufMapDetails = {
        AC: { path: "M 23.3,165.2 L 35.8,162.1 L 49.6,168.3 L 72.8,162.9 L 88.2,172.1 L 81.3,185.9 L 58.6,188.8 L 39.7,198.3 L 13.4,185.2 Z", label: [48, 178], bbox: "0 140 120 80" },
        AL: { path: "M 425.2,152.1 L 441.8,150.5 L 448.2,158.4 L 431.5,164.2 Z", label: [438, 156], bbox: "400 130 70 50" },
        AM: { path: "M 63.8,45.2 L 111.2,42.4 L 168.5,75.1 L 229.8,73.8 L 253.9,106.3 L 239.1,163.2 L 191.2,174.0 L 153.8,158.5 L 103.1,183.9 L 69.2,162.6 L 85.9,122.3 L 50.2,105.1 Z", label: [150, 110], bbox: "40 25 230 180" },
        AP: { path: "M 325.2,18.2 L 359.8,2.5 L 377.3,37.1 L 358.1,75.9 L 320.5,67.8 Z", label: [348, 40], bbox: "300 -10 100 100" },
        BA: { path: "M 345.2,156.4 L 388.5,151.8 L 423.8,189.2 L 401.5,248.6 L 360.8,287.9 L 324.2,280.0 L 301.6,232.5 Z", label: [362, 220], bbox: "280 135 160 170" },
        CE: { path: "M 382.1,68.4 L 424.8,59.0 L 441.5,97.1 L 407.6,117.6 Z", label: [412, 88], bbox: "360 45 100 90" },
        DF: { path: "M 283.8,220.5 L 293.5,220.5 L 293.5,228.2 L 283.8,228.2 Z", label: [288, 224], bbox: "220 170 140 110" },
        ES: { path: "M 363.2,280.2 L 398.3,285.6 L 389.5,320.2 L 354.7,313.0 Z", label: [378, 298], bbox: "330 260 90 80" },
        GO: { path: "M 245.2,201.0 L 306.0,192.2 L 332.6,247.6 L 297.4,292.2 L 241.4,273.0 Z", label: [280, 245], bbox: "220 175 130 130" },
        MA: { path: "M 298.2,56.4 L 352.4,47.8 L 379.0,108.4 L 346.2,147.8 L 300.4,123.0 Z", label: [338, 98], bbox: "280 30 110 130" },
        MG: { path: "M 290.2,274.4 L 363.0,268.2 L 402.4,309.6 L 377.6,368.4 L 302.4,354.2 L 283.0,308.4 Z", label: [340, 320], bbox: "265 245 155 140" },
        MS: { path: "M 180.4,273.0 L 241.6,266.2 L 266.4,327.6 L 226.2,380.2 L 174.2,347.6 Z", label: [218, 325], bbox: "155 245 130 150" },
        MT: { path: "M 130.2,132.4 L 251.0,120.2 L 291.6,212.4 L 222.4,272.2 L 142.2,226.4 Z", label: [205, 190], bbox: "110 100 200 190" },
        PA: { path: "M 215.2,28.2 L 322.0,14.4 L 375.4,100.2 L 335.2,160.4 L 229.0,148.2 Z", label: [285, 85], bbox: "195 0 200 180" },
        PB: { path: "M 412.2,102.1 L 452.8,100.3 L 460.0,117.5 L 406.2,122.1 Z", label: [435, 110], bbox: "390 85 80 50" },
        PE: { path: "M 366.4,122.1 L 458.4,120.3 L 452.4,142.3 L 372.4,148.1 Z", label: [415, 133], bbox: "350 100 120 60" },
        PI: { path: "M 342.2,68.4 L 390.0,62.2 L 402.8,148.4 L 356.2,168.2 L 336.0,122.4 Z", label: [370, 115], bbox: "320 45 100 140" },
        PR: { path: "M 220.2,372.4 L 300.4,360.2 L 314.2,401.0 L 240.4,418.4 Z", label: [265, 388], bbox: "200 345 130 90" },
        RJ: { path: "M 362.8,340.2 L 402.2,332.4 L 396.0,353.0 L 350.0,358.4 Z", label: [378, 346], bbox: "330 315 90 60" },
        RN: { path: "M 400.2,76.2 L 446.4,74.4 L 452.4,96.2 L 406.4,96.2 Z", label: [426, 85], bbox: "380 60 80 50" },
        RO: { path: "M 81.2,166.4 L 161.2,158.4 L 181.2,212.4 L 121.2,246.2 Z", label: [130, 200], bbox: "60 140 140 120" },
        RR: { path: "M 109.2,0.0 L 181.4,0.0 L 195.4,68.2 L 129.2,88.2 Z", label: [150, 35], bbox: "90 -15 120 120" },
        RS: { path: "M 206.2,460.2 L 280.2,452.4 L 286.2,520.2 L 214.2,532.4 Z", label: [248, 490], bbox: "180 430 120 120" },
        SC: { path: "M 234.2,420.2 L 306.4,412.4 L 300.4,452.4 L 226.2,452.4 Z", label: [268, 432], bbox: "200 395 120 70" },
        SE: { path: "M 412.2,166.4 L 432.2,164.4 L 424.4,180.4 L 408.2,178.4 Z", label: [420, 172], bbox: "390 145 60 50" },
        SP: { path: "M 266.4,327.6 L 354.2,312.4 L 366.4,360.2 L 286.4,372.4 Z", label: [315, 345], bbox: "245 295 140 90" },
        TO: { path: "M 271.2,120.4 L 325.4,114.4 L 339.2,214.4 L 291.4,220.4 Z", label: [305, 168], bbox: "250 95 100 140" }
      };

      const maxVal = Math.max(...Object.values(ufData).map(d => typeof d === 'number' ? d : (d?.repassado || 0)), 1);
      const singleSelectedUF = selectedUFs.length === 1 ? selectedUFs[0] : null;
      const activeViewBox = singleSelectedUF && ufMapDetails[singleSelectedUF]?.bbox 
        ? ufMapDetails[singleSelectedUF].bbox 
        : "0 -10 480 550";

      const focusedInfo = singleSelectedUF ? (
        typeof ufData[singleSelectedUF] === 'object' 
          ? ufData[singleSelectedUF] 
          : { empenho: 0, repassado: ufData[singleSelectedUF] || 0, total: 0, count: 0 }
      ) : null;

      const faltaRepassarFocused = focusedInfo ? Math.max(0, focusedInfo.empenho - focusedInfo.repassado) : 0;

      return (
        <div className="flex flex-col items-center w-full relative">
          {singleSelectedUF && focusedInfo && (
            <div className={`absolute top-2 left-2 z-20 border rounded-2xl p-3 sm:p-4 shadow-2xl backdrop-blur-xl animate-fadeIn transition-all text-xs max-w-[200px] sm:max-w-[240px] w-full ${
              isLightMode 
                ? 'bg-white/95 border-slate-300 text-slate-900 shadow-slate-300/60' 
                : 'bg-slate-900/85 border-slate-700/60 text-slate-100 shadow-black/80'
            }`}>
              <div className="flex items-center justify-between border-b pb-2 mb-2 sm:mb-3 border-emerald-500/30">
                <div className="flex items-center gap-1.5 sm:gap-2">
                  <span className="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className={`font-black text-xs sm:text-sm tracking-wide ${isLightMode ? 'text-emerald-700' : 'text-emerald-400'}`}>
                    {ufNames[singleSelectedUF]} ({singleSelectedUF})
                  </span>
                </div>
                <span className={`text-[9px] sm:text-[10px] border font-bold px-1.5 sm:px-2 py-0.5 rounded-full uppercase tracking-wider ${isLightMode ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400'}`}>
                  Focado
                </span>
              </div>

              <div className="space-y-1.5 sm:space-y-2 text-[10px] sm:text-[11px] font-medium">
                <div className={`flex items-center justify-between p-1 sm:p-1.5 rounded-lg ${isLightMode ? 'bg-slate-100' : 'bg-slate-800/20'}`}>
                  <span className={isLightMode ? 'text-slate-600' : 'text-slate-400'}>Vol. Global:</span>
                  <span className={`font-extrabold ${isLightMode ? 'text-slate-900' : 'text-slate-100'}`}>{fmtR$(focusedInfo.total)}</span>
                </div>
                <div className={`flex items-center justify-between p-1 sm:p-1.5 rounded-lg ${isLightMode ? 'bg-amber-50' : 'bg-amber-500/10'}`}>
                  <span className={isLightMode ? 'text-amber-800 font-semibold' : 'text-amber-400/90 font-semibold'}>Empenhado:</span>
                  <span className={`font-bold ${isLightMode ? 'text-amber-900' : 'text-amber-400'}`}>{fmtR$(focusedInfo.empenho)}</span>
                </div>
                <div className={`flex items-center justify-between p-1 sm:p-1.5 rounded-lg ${isLightMode ? 'bg-emerald-50' : 'bg-emerald-500/10'}`}>
                  <span className={isLightMode ? 'text-emerald-800 font-semibold' : 'text-emerald-400/90 font-semibold'}>Repassado:</span>
                  <span className={`font-bold ${isLightMode ? 'text-emerald-900' : 'text-emerald-400'}`}>{fmtR$(focusedInfo.repassado)}</span>
                </div>
                <div className={`flex items-center justify-between p-1 sm:p-1.5 rounded-lg ${isLightMode ? 'bg-rose-50' : 'bg-rose-500/10'}`}>
                  <span className={isLightMode ? 'text-rose-800 font-semibold' : 'text-rose-400/90 font-semibold'}>Falta Repassar:</span>
                  <span className={`font-bold ${isLightMode ? 'text-rose-900' : 'text-rose-400'}`}>{fmtR$(faltaRepassarFocused)}</span>
                </div>
                <div className={`flex items-center justify-between pt-1.5 border-t px-1 ${isLightMode ? 'border-slate-200' : 'border-slate-700/40'}`}>
                  <span className={isLightMode ? 'text-slate-600' : 'text-slate-400'}>Processos:</span>
                  <span className={`font-black px-1.5 py-0.5 rounded-md border ${isLightMode ? 'text-sky-900 bg-sky-100 border-sky-300' : 'text-sky-400 bg-sky-500/10 border-sky-500/20'}`}>
                    {focusedInfo.count || 0}
                  </span>
                </div>
              </div>
            </div>
          )}

          <svg 
            viewBox={activeViewBox} 
            className={`w-full filter drop-shadow-xl transition-all duration-500 ease-in-out ${isModal ? 'h-[280px] sm:h-[420px]' : 'h-64 sm:h-80 max-w-sm'}`}
          >
            <g>
              {Object.keys(ufMapDetails).map(uf => {
                const isSelected = selectedUFs.includes(uf);
                const isDimmed = selectedUFs.length > 0 && !isSelected;
                const ufInfo = typeof ufData[uf] === 'object' ? ufData[uf] : { empenho: 0, repassado: ufData[uf] || 0, total: 0, count: 0 };
                const val = ufInfo.repassado || 0;
                const faltaRepassarVal = Math.max(0, (ufInfo.empenho || 0) - val);

                const opacity = val > 0 ? Math.max(0.55, val / maxVal) : 0.85;
                const baseFill = isSelected ? '#10b981' : (val > 0 ? (isLightMode ? '#0284c7' : '#0284c7') : (isLightMode ? '#cbd5e1' : '#334155'));
                const strokeColor = isSelected ? '#ffffff' : (val > 0 ? '#38bdf8' : (isLightMode ? '#64748b' : '#64748b'));

                const name = ufNames[uf] || uf;
                const formattedEmpenho = fmtR$(ufInfo.empenho || 0);
                const formattedRepassado = fmtR$(val);
                const formattedFaltaRepassar = fmtR$(faltaRepassarVal);
                const formattedTotal = fmtR$(ufInfo.total || 0);

                const detail = ufMapDetails[uf];

                return (
                  <g key={uf}>
                    <path
                      d={detail.path}
                      className={`uf-path ${isSelected ? 'selected' : ''} ${isDimmed ? 'dimmed' : ''}`}
                      fill={baseFill}
                      fillOpacity={isSelected ? 1 : (isDimmed ? 0.2 : opacity)}
                      stroke={strokeColor}
                      strokeWidth={isSelected ? (singleSelectedUF === uf ? "3" : "2") : "1.2"}
                      onClick={() => onToggleUF && onToggleUF(uf)}
                    >
                      <title>{`${name} (${uf})\n• Valor Empenhado: ${formattedEmpenho}\n• Valor Repassado: ${formattedRepassado}\n• Falta Repassar: ${formattedFaltaRepassar}\n• Valor Global: ${formattedTotal}\n• Processos: ${ufInfo.count || 0}`}</title>
                    </path>
                    {detail.label && (
                      <text x={detail.label[0]} y={detail.label[1]} className={`uf-label ${isDimmed ? 'opacity-30' : ''}`}>
                        {uf}
                      </text>
                    )}
                  </g>
                );
              })}
            </g>
          </svg>
          
          <div className={`text-[10px] sm:text-[11px] mt-3 flex flex-wrap items-center justify-center gap-2 sm:gap-4 px-3 sm:px-4 py-1.5 rounded-full border shadow-sm print:text-black print:bg-transparent print:border-none ${isLightMode ? 'bg-white text-slate-800 border-slate-300 font-semibold' : 'bg-slate-900/90 text-slate-300 border-slate-800'}`}>
            <span className="flex items-center gap-1.5 font-medium"><span className="w-2.5 h-2.5 rounded-full bg-sky-600 inline-block shadow-sm"></span> Com Repasse</span>
            <span className="flex items-center gap-1.5 font-medium"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shadow-sm"></span> Selecionado</span>
            <span className="flex items-center gap-1.5 font-medium"><span className={`w-2.5 h-2.5 rounded-full border inline-block ${isLightMode ? 'bg-slate-300 border-slate-400' : 'bg-slate-700 border-slate-500'}`}></span> Sem Repasse</span>
          </div>
        </div>
      );
    };

    // MODAL MODERNO DE DETALHAMENTO DO INSTRUMENTO (FICHA EXECUTIVA)
    const InstrumentDetailModal = ({ item, onClose, isLightMode, riskStatus }) => {
      useEffect(() => {
        document.body.classList.add('modal-open');
        return () => document.body.classList.remove('modal-open');
      }, []);

      if (!item) return null;

      const faltaRepassar = Math.max(0, item.empenho - item.repassado);
      const pctExecucao = item.empenho > 0 ? ((item.repassado / item.empenho) * 100).toFixed(1) : (item.global > 0 ? ((item.repassado / item.global) * 100).toFixed(1) : '0.0');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-3 sm:p-4 animate-fadeIn">
          <div className={`border rounded-2xl sm:rounded-3xl p-4 sm:p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col gap-4 sm:gap-6 relative transition-all ${
            isLightMode ? 'bg-white border-slate-300 text-slate-900' : 'bg-slate-900 border-slate-800 text-slate-100'
          }`}>
            
            {/* CABEÇALHO DA FICHA */}
            <div className={`flex items-start justify-between border-b pb-3 sm:pb-4 sticky top-0 bg-inherit z-10 ${isLightMode ? 'border-slate-200' : 'border-slate-700/40'}`}>
              <div className="space-y-1 pr-3 sm:pr-6">
                <div className="flex flex-wrap items-center gap-1.5 sm:gap-2">
                  <span className="text-[9px] sm:text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-blue-700 text-white shadow-sm">
                    Ficha Executiva
                  </span>
                  <span className={`text-[9px] sm:text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full border ${isLightMode ? 'bg-slate-100 border-slate-300 text-blue-900' : 'bg-slate-800 border-slate-700 text-sky-400'}`}>
                    {item.instrumento}
                  </span>
                </div>
                <h2 className={`text-base sm:text-xl font-black tracking-tight leading-tight mt-1 ${isLightMode ? 'text-blue-950' : 'text-sky-400'}`}>
                  {item.proponente}
                </h2>
                <p className={`text-[11px] sm:text-xs font-medium flex items-center gap-1.5 sm:gap-2 flex-wrap ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>
                  <span>UF: <strong>{item.uf}</strong></span> • 
                  <span>Cidade: <strong>{item.cidadeSede}</strong></span> • 
                  <span>Ano: <strong>{item.ano}</strong></span> • 
                  <span>Mod: <strong>{item.rp}</strong></span>
                </p>
              </div>

              <button
                onClick={onClose}
                className={`w-8 h-8 sm:w-9 sm:h-9 rounded-full shrink-0 flex items-center justify-center font-bold text-sm transition-all ${
                  isLightMode ? 'bg-slate-100 hover:bg-slate-200 text-slate-800' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                }`}
              >
                ✕
              </button>
            </div>

            {/* DADOS DE IDENTIFICAÇÃO E SEI */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3">
              <div className={`p-3 sm:p-3.5 rounded-xl sm:rounded-2xl border ${isLightMode ? 'bg-slate-50 border-slate-300' : 'bg-slate-950/60 border-slate-800'}`}>
                <span className={`text-[9px] sm:text-[10px] font-bold uppercase tracking-wider block mb-0.5 ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>Processo SEI</span>
                <span className={`font-mono text-xs sm:text-sm font-bold select-all block truncate ${isLightMode ? 'text-cyan-900' : 'text-cyan-400'}`}>
                  {item.numSEI}
                </span>
              </div>

              <div className={`p-3 sm:p-3.5 rounded-xl sm:rounded-2xl border ${isLightMode ? 'bg-slate-50 border-slate-300' : 'bg-slate-950/60 border-slate-800'}`}>
                <span className={`text-[9px] sm:text-[10px] font-bold uppercase tracking-wider block mb-0.5 ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>Nº Proposta</span>

    const MultiSelectDropdown = ({ title, options, selectedValues, onChange, isLightMode }) => {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const toggleOption = (val) => {
        if (selectedValues.includes(val)) {
          onChange(selectedValues.filter(v => v !== val));
        } else {
          onChange([...selectedValues, val]);
        }
      };

      return (
        <div className="relative" ref={ref}>
          <label className={`text-xs mb-1 block font-bold ${isLightMode ? 'text-slate-800' : 'text-slate-400'}`}>{title}</label>
          <button
            type="button"
            onClick={() => setOpen(!open)}
            className={`w-full border rounded-xl px-3 py-2 text-xs flex items-center justify-between gap-2 text-left font-semibold ${isLightMode ? 'bg-white border-slate-300 text-slate-900 shadow-sm' : 'bg-slate-950 border-slate-800 text-white'}`}
          >
            <span className="truncate">
              {selectedValues.length === 0 
                ? `Todos (${options.length})` 
                : selectedValues.length === options.length 
                  ? 'Todos selecionados' 
                  : `${selectedValues.length} sel.`}
            </span>
            <span className={isLightMode ? 'text-slate-700' : 'text-slate-400'}>▼</span>
          </button>

          {open && (
            <div className={`absolute z-50 mt-1 w-full border rounded-xl shadow-2xl p-2 max-h-56 overflow-y-auto space-y-1 ${isLightMode ? 'bg-white border-slate-300' : 'bg-slate-900 border-slate-700'}`}>
              <div className={`flex justify-between text-[10px] pb-1 border-b font-semibold px-1 ${isLightMode ? 'border-slate-200' : 'border-slate-700'}`}>
                <button type="button" onClick={() => onChange([...options])} className="text-blue-600 hover:underline font-bold">Marcar Todos</button>
                <button type="button" onClick={() => onChange([])} className="text-rose-600 hover:underline font-bold">Desmarcar Todos</button>
              </div>
              {options.map(opt => (
                <label key={opt} className={`flex items-center gap-2 px-2 py-1 rounded cursor-pointer text-xs ${isLightMode ? 'hover:bg-slate-100 text-slate-900 font-medium' : 'hover:bg-slate-800 text-slate-200'}`}>
                  <input
                    type="checkbox"
                    checked={selectedValues.includes(opt)}
                    onChange={() => toggleOption(opt)}
                    className="rounded text-blue-600 focus:ring-0"
                  />
                  <span className="truncate">{opt}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      );
    };
   
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {

      });

      const [authError, setAuthError] = useState(false);

      const [data, setData] = useState([]);
      const [budgets, setBudgets] = useState({});
      const [fileName, setFileName] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      
      const [isLightMode, setIsLightMode] = useState(false);

      const [filterTab, setFilterTab] = useState('ALL');
      const [filterAno, setFilterAno] = useState('ALL');
      const [filterAnoRepasse, setFilterAnoRepasse] = useState('ALL');
      const [selectedUFs, setSelectedUFs] = useState([]);
      const [selectedProgramas, setSelectedProgramas] = useState([]);
      const [selectedParlamentares, setSelectedParlamentares] = useState([]);
      const [filterRP, setFilterRP] = useState('ALL');
      const [filterFaixaValor, setFilterFaixaValor] = useState('ALL');
      const [filterVigenciaAlerta, setFilterVigenciaAlerta] = useState('ALL');
      const [filterFaltaRepassar, setFilterFaltaRepassar] = useState(false);
      const [filterEmpenhados, setFilterEmpenhados] = useState(false);
      const [filterRepassados, setFilterRepassados] = useState(false);
      const [filterNaoEmpenhados, setFilterNaoEmpenhados] = useState(false);
      const [search, setSearch] = useState('');

      const [currentPage, setCurrentPage] = useState(1);
      const [itemsPerPage, setItemsPerPage] = useState(25);
      const [sortConfig, setSortConfig] = useState({ key: 'global', direction: 'desc' });
      const [presentationMode, setPresentationMode] = useState(false);

      const [expandedItem, setExpandedItem] = useState(null);
      const [selectedInstrument, setSelectedInstrument] = useState(null);

      const chartUfRef = useRef(null);
      const chartTypeRef = useRef(null);
      const chartProgramRef = useRef(null);
      const chartRpRef = useRef(null);
      const chartParlamentarRef = useRef(null);

      const instanceUf = useRef(null);
      const instanceType = useRef(null);
      const instanceProgram = useRef(null);
      const instanceRp = useRef(null);
      const instanceParlamentar = useRef(null);

      const currentYear = new Date().getFullYear();

      // PARSER DA PLANILHA COM FILTRO ESTRITO DE DADOS ZERADOS
      const processWorkbook = (wb, sourceName = 'Planilha de Emendas - Resumida.xlsx') => {
        let allRows = [];
        let budgetMap = {};

        wb.SheetNames.forEach(sheetName => {
          const sheetLower = sheetName.toLowerCase().trim();
          
          if (sheetLower.includes('orçamento') || sheetLower.includes('orcamento')) {
            const wsOrc = wb.Sheets[sheetName];
            const rowsOrc = XLSX.utils.sheet_to_json(wsOrc, { defval: '' });
            rowsOrc.forEach(r => {
              const keys = Object.keys(r);
              const anoKey = keys.find(k => k.toLowerCase().includes('ano'));
              const valKey = keys.find(k => k.toLowerCase().includes('valor') || k.toLowerCase().includes('orçamento') || k.toLowerCase().includes('orcamento'));
              if (anoKey && valKey) {
                const ano = String(r[anoKey]).split('.')[0].trim();
                const val = parseVal(r[valKey]);
                if (ano && val > 0) budgetMap[ano] = val;
              }
            });
            return;
          }

          let instrumento = '';
          if (sheetLower.includes('convên') || sheetLower.includes('convenio')) instrumento = 'Convênio';
          else if (sheetLower.includes('fomento')) instrumento = 'Termo de Fomento';
          else if (sheetLower === 'ted' || sheetLower.includes('ted ')) instrumento = 'TED';
          else return;

          const ws = wb.Sheets[sheetName];
          const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

          if (matrix.length < 2) return;

          let headerIdx = -1;
          for (let i = 0; i < Math.min(6, matrix.length); i++) {
            const rowStr = matrix[i].map(c => String(c).toLowerCase()).join(' ');
            if (rowStr.includes('proponente') || rowStr.includes('objeto') || rowStr.includes('parlamentar') || rowStr.includes('modalidade') || rowStr.includes('sei')) {
              headerIdx = i;
              break;
            }
          }

          if (headerIdx === -1) headerIdx = 1;

          const headers = matrix[headerIdx].map(h => String(h).trim().toLowerCase());
          const findColIdx = (terms) => headers.findIndex(h => terms.some(t => h.includes(t)));

          const idxAno = findColIdx(['ano']);
          const idxProponente = findColIdx(['proponente', 'nome', 'convenente']);
          const idxObjeto = findColIdx(['objeto', 'descrição do objeto', 'descricao do objeto']);
          const idxParlamentar = findColIdx(['parlamentar', 'deputado', 'senador', 'autor']);
          const idxUF = findColIdx(['uf do proponente', 'uf', 'estado']);
          const idxCidadeSede = findColIdx(['cidade sede', 'cidade', 'município', 'municipio']);
          const idxInstrumento = findColIdx(['instrumento', 'número', 'numero', 'nº', 'convênio']);
          const idxNumProposta = findColIdx(['número da proposta', 'numero da proposta', 'proposta']);
          const idxModalidade = findColIdx(['modalidade', 'mod', 'mod. aplic', 'mod.aplic.', 'rp']);
          const idxSEI = findColIdx(['número do processo sei', 'nº sei', 'sei', 'numero sei', 'número sei', 'processo sei', 'processo']);
          const idxPrograma = findColIdx(['código do programa', 'codigo do programa', 'cod. programa', 'programa']);
          const idxInicioVigencia = findColIdx(['data início vigência', 'início da vigência', 'inicio da vigencia', 'início vigência', 'inicio vigencia', 'data início', 'data inicio']);
          const idxFimVigencia = findColIdx(['data fim vigência', 'fim da vigência', 'fim da vigencia', 'término vigência', 'termino vigencia', 'data fim', 'término', 'termino']);
          const idxRepasseProposta = findColIdx(['valor de repasse da proposta', 'repasse da proposta', 'valor repasse', 'valor de repasse']);
          const idxGlobal = findColIdx(['valor global', 'total do plano', 'valor total', 'valor']);
          const idxEmpenho = findColIdx(['empenho', 'valor do empenho']);
          const idxRepassado = findColIdx(['repassado', 'valor já repassado', 'pago']);
          const idxDataRepasse = findColIdx(['data do repasse', 'data repasse', 'data de pagamento', 'data pagamento', 'ano repasse']);
          const idxObs = findColIdx(['motivo', 'situação', 'observações', 'status', 'observacao']);

          for (let r = headerIdx + 1; r < matrix.length; r++) {
            const row = matrix[r];
            if (!row || row.length === 0) continue;

            const proponente = idxProponente !== -1 ? String(row[idxProponente] || '').trim() : '';
            const globalVal = idxGlobal !== -1 ? parseVal(row[idxGlobal]) : 0;
            const repassePropostaVal = idxRepasseProposta !== -1 ? parseVal(row[idxRepasseProposta]) : globalVal;
            let empenhoVal = instrumento === 'TED' ? globalVal : (idxEmpenho !== -1 ? parseVal(row[idxEmpenho]) : 0);
            const repassadoVal = idxRepassado !== -1 ? parseVal(row[idxRepassado]) : 0;

            // ELIMINA DADOS ZERADOS FANTASMA
            if (globalVal === 0 && empenhoVal === 0 && repassadoVal === 0) {
              continue;
            }

            if (!proponente || proponente === '-' || proponente.toLowerCase().includes('total') || proponente.toLowerCase().includes('nome do proponente')) {
              continue;
            }

            const objetoVal = idxObjeto !== -1 && row[idxObjeto] ? String(row[idxObjeto]).trim() : '-';
            const parlamentar = idxParlamentar !== -1 && row[idxParlamentar] ? String(row[idxParlamentar]).trim() : '-';
            const uf = idxUF !== -1 && row[idxUF] ? String(row[idxUF]).trim().toUpperCase() : 'BR';
            const cidadeSede = idxCidadeSede !== -1 && row[idxCidadeSede] ? String(row[idxCidadeSede]).trim() : '-';
            const anoCelebracao = idxAno !== -1 && row[idxAno] ? String(row[idxAno]).split('.')[0].trim() : String(currentYear);
            const codInst = idxInstrumento !== -1 && row[idxInstrumento] ? String(row[idxInstrumento]).trim() : '';
            const numProposta = idxNumProposta !== -1 && row[idxNumProposta] ? String(row[idxNumProposta]).trim() : '-';
            const numSEI = idxSEI !== -1 && row[idxSEI] ? String(row[idxSEI]).trim() : '-';
            
            let rawPrograma = idxPrograma !== -1 && row[idxPrograma] ? String(row[idxPrograma]).trim() : '';
            let codPrograma = rawPrograma && rawPrograma !== '-' ? rawPrograma : (instrumento === 'TED' ? 'TED' : 'Sem Programa');

            const inicioVig = idxInicioVigencia !== -1 ? fmtDate(row[idxInicioVigencia]) : '-';
            const fimVig = idxFimVigencia !== -1 ? fmtDate(row[idxFimVigencia]) : '-';
            
            const rawDataRepasse = idxDataRepasse !== -1 ? row[idxDataRepasse] : '';
            const dataRepasseFmt = rawDataRepasse ? fmtDate(rawDataRepasse) : '-';
            const anoRepasseReal = repassadoVal > 0 ? extractYear(rawDataRepasse, anoCelebracao) : '-';

            let rawModalidade = idxModalidade !== -1 && row[idxModalidade] ? String(row[idxModalidade]).trim() : '';
            let rpVal = '';

            if (rawModalidade) {
              const matchRP = rawModalidade.match(/rp\s*[-_]?\s*(\d+|\w+)/i);
              if (matchRP) rpVal = `RP ${matchRP[1].toUpperCase()}`;
              else if (/^\d+$/.test(rawModalidade)) rpVal = `RP ${rawModalidade}`;
              else rpVal = rawModalidade.toUpperCase().startsWith('RP') ? rawModalidade.toUpperCase() : `RP ${rawModalidade}`;
            }

            const obsVal = idxObs !== -1 && row[idxObs] ? String(row[idxObs]).trim() : '-';

            const fimVigObj = parseDateObj(fimVig);
            let diasParaVencer = null;
            let alertaVigencia = false;

            if (fimVigObj) {
              const today = new Date();
              const diffTime = fimVigObj.getTime() - today.getTime();
              diasParaVencer = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
              if (fimVigObj.getFullYear() === currentYear) alertaVigencia = true;
            }

            allRows.push({
              id: `${sheetName}-${r}`,
              instrumento,
              codInst: codInst || instrumento,
              numProposta: numProposta || '-',
              rp: rpVal || 'RP Não Ind.',
              proponente: proponente || 'N/A',
              objeto: objetoVal || '-',
              parlamentar: parlamentar || '-',
              numSEI: numSEI || '-',
              codPrograma,
              inicioVigencia: inicioVig || '-',
              fimVigencia: fimVig || '-',
              fimVigObj,
              diasParaVencer,
              alertaVigencia,
              uf: (uf && uf.length === 2) ? uf : 'BR',
              cidadeSede: cidadeSede || '-',
              ano: anoCelebracao || String(currentYear),
              dataRepasse: dataRepasseFmt,
              anoRepasse: anoRepasseReal,
              global: globalVal,
              repasseProposta: repassePropostaVal > 0 ? repassePropostaVal : globalVal,
              empenho: empenhoVal,
              repassado: repassadoVal,

            });
          }

        setData(allRows);

      // CARREGAMENTO INICIAL
      useEffect(() => {

            'planilha-de-emendas-resumida.xlsx',
            'Planilha_de_Emendas_Resumida.xlsx',

          ];

          let carregado = false;

          for (const nome of nomesArquivos) {
            try {
              const urlEncoded = `./${encodeURIComponent(nome)}`;
              const response = await fetch(urlEncoded);
              if (response.ok) {
                const arrayBuffer = await response.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, { type: 'array' });
                processWorkbook(wb, nome);
                carregado = true;
                break;
              }
            } catch (err) {
              // Tenta o próximo nome
            }
          }

          if (!carregado) {
            console.log('Sem planilha padrão disponível no Vercel. Utilize o botão para subir o arquivo manualmente.');
          }

          setIsLoading(false);
        };

        loadDefaultSheet();
      }, [isAuthenticated]);

      // LOGIN SEGURO VIA API DA VERCEL
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError(false);
        setIsLoading(true);

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: passwordInput })
          });

          const result = await response.json();

          if (result.success) {
            setIsAuthenticated(true);
            sessionStorage.setItem('mtur_dashboard_auth', 'true');
          } else {
            setAuthError(true);
          }
        } catch (err) {
          // Fallback seguro caso rode fora do ambiente de API Vercel
          if (passwordInput === 'CGQT') {
            setIsAuthenticated(true);
            sessionStorage.setItem('mtur_dashboard_auth', 'true');
          } else {
            setAuthError(true);
          }
        } finally {
          setIsLoading(false);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('mtur_dashboard_auth');
        setPasswordInput('');
      };

      const parseVal = (val) => {
        if (val === undefined || val === null || val === '') return 0;
        if (typeof val === 'number') return val;
        let str = String(val).replace(/[R$\s]/g, '');
        if (str.includes(',') && str.includes('.')) str = str.replace(/\./g, '').replace(',', '.');
        else if (str.includes(',')) str = str.replace(',', '.');
        return parseFloat(str) || 0;
      };

      const fmtDate = (val) => {
        if (!val) return '-';
        if (typeof val === 'number') {
          const dateObj = XLSX.SSF.parse_date_code(val);
          if (dateObj) {
            return `${String(dateObj.d).padStart(2, '0')}/${String(dateObj.m).padStart(2, '0')}/${dateObj.y}`;
          }
        }
        let str = String(val).trim();
        if (str.includes('T')) str = str.split('T')[0];
        if (str.includes('-')) {
          const parts = str.split('-');
          if (parts.length === 3 && parts[0].length === 4) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        return str || '-';
      };

      const parseDateObj = (str) => {
        if (!str || str === '-') return null;
        if (str.includes('/')) {
          const parts = str.split('/');
          if (parts.length === 3) return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
        }
        return null;
      };

      const extractYear = (val, defaultYear) => {
        if (!val || val === '-') return defaultYear || '-';
        const formatted = fmtDate(val);
        if (formatted.includes('/')) {
          const parts = formatted.split('/');
          return parts[2] || defaultYear;
        }
        const str = String(val).trim();
        const yearMatch = str.match(/\b(20\d\d)\b/);
        return yearMatch ? yearMatch[1] : defaultYear;
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsLoading(true);
        const reader = new FileReader();

        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            processWorkbook(wb, file.name);
          } catch (err) {
            console.error(err);
            alert('Erro ao processar a planilha enviada.');
          } finally {
            setIsLoading(false);
          }
        };

        reader.readAsBinaryString(file);
      };

      const handleResetFilters = () => {
        setFilterTab('ALL');
        setFilterAno('ALL');
        setFilterAnoRepasse('ALL');
        setSelectedUFs([]);
        setSelectedProgramas([]);
        setSelectedParlamentares([]);
        setFilterRP('ALL');
        setFilterFaixaValor('ALL');
        setFilterVigenciaAlerta('ALL');
        setFilterFaltaRepassar(false);
        setFilterEmpenhados(false);
        setFilterRepassados(false);
        setFilterNaoEmpenhados(false);
        setSearch('');
        setCurrentPage(1);
      };

      const filteredData = useMemo(() => {
        return data.filter(item => {
          if (filterTab !== 'ALL' && item.instrumento !== filterTab) return false;
          if (filterAno !== 'ALL' && item.ano !== filterAno) return false;
          if (filterAnoRepasse !== 'ALL' && item.anoRepasse !== filterAnoRepasse) return false;
          if (selectedUFs.length > 0 && !selectedUFs.includes(item.uf)) return false;
          if (selectedProgramas.length > 0 && !selectedProgramas.includes(item.codPrograma)) return false;
          if (selectedParlamentares.length > 0 && !selectedParlamentares.includes(item.parlamentar)) return false;
          if (filterRP !== 'ALL' && item.rp !== filterRP) return false;
          
          if (filterFaixaValor === '500K' && item.global > 500000) return false;
          if (filterFaixaValor === '500K_2M' && (item.global <= 500000 || item.global > 2000000)) return false;
          if (filterFaixaValor === '2M' && item.global <= 2000000) return false;

          if (filterVigenciaAlerta === 'ALERTA' && !item.alertaVigencia) return false;
          if (filterVigenciaAlerta === '30' && (item.diasParaVencer === null || item.diasParaVencer < 0 || item.diasParaVencer > 30)) return false;
          if (filterVigenciaAlerta === '60' && (item.diasParaVencer === null || item.diasParaVencer <= 30 || item.diasParaVencer > 60)) return false;
          if (filterVigenciaAlerta === '90' && (item.diasParaVencer === null || item.diasParaVencer <= 60 || item.diasParaVencer > 90)) return false;
          
          if (filterFaltaRepassar && item.empenho <= item.repassado) return false;
          if (filterEmpenhados && (item.instrumento === 'TED' ? item.global <= 0 : item.empenho <= 0)) return false;
          if (filterRepassados && item.repassado <= 0) return false;
          if (filterNaoEmpenhados && (item.instrumento === 'TED' ? true : item.global <= item.empenho)) return false;

          if (search && !item.proponente.toLowerCase().includes(search.toLowerCase()) &&

              !item.cidadeSede.toLowerCase().includes(search.toLowerCase()) &&
              !item.parlamentar.toLowerCase().includes(search.toLowerCase()) && 
              !item.obs.toLowerCase().includes(search.toLowerCase()) &&

              return sortConfig.direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);

      const handleToggleUFMap = (uf) => {

          map[d.uf].empenho += d.empenho;

              { label: 'Empenhado', data: sortedProgs.map(p => progMetricsMap[p].empenho), backgroundColor: '#d97706', borderRadius: 4 },
              { label: 'Repassado', data: sortedProgs.map(p => progMetricsMap[p].repassado), backgroundColor: '#059669', borderRadius: 4 },
              { label: 'Falta Repassar', data: sortedProgs.map(p => Math.max(0, progMetricsMap[p].empenho - progMetricsMap[p].repassado)), backgroundColor: '#e11d48', borderRadius: 4 }
            ] 
          },
          options: { 
            indexAxis: 'y', 
            responsive: true, 
            maintainAspectRatio: false, 
            layout: { padding: { right: 25 } },
            plugins: { 
              legend: { display: true, position: 'top', labels: { color: textColor, font: { size: 11, weight: 'bold' }, boxWidth: 12 } },
              tooltip: { callbacks: { label: tooltipCallback } }
            }, 
            scales: { 
              x: { grace: '15%', ticks: { color: textColor, font: { weight: 'bold' }, callback: (val) => formatMillionsAxis(val) }, grid: { color: gridColor } }, 
              y: { ticks: { color: textColor, font: { weight: 'bold' } }, grid: { display: false } } 
            },
            onClick: (e, elements) => {
              if (elements.length > 0) {
                const clickedProg = sortedProgs[elements[0].index];
                setSelectedProgramas(prev => prev.includes(clickedProg) ? prev.filter(p => p !== clickedProg) : [...prev, clickedProg]);
              }
            }
          }
        };

        const typeMap = { 
          'Convênio': { global: 0, empenho: 0, repassado: 0, faltaRepassar: 0 }, 
          'Termo de Fomento': { global: 0, empenho: 0, repassado: 0, faltaRepassar: 0 }, 
          'TED': { global: 0, empenho: 0, repassado: 0, faltaRepassar: 0 } 
        };

        filteredData.forEach(d => { 
          if (typeMap[d.instrumento]) {
            typeMap[d.instrumento].global += d.global;
            typeMap[d.instrumento].empenho += d.empenho;
            typeMap[d.instrumento].repassado += d.repassado;
            typeMap[d.instrumento].faltaRepassar += Math.max(0, d.empenho - d.repassado);
          }
        });
        
        const typeKeys = Object.keys(typeMap);

        const configType = {
          type: 'doughnut',
          data: { 
            labels: typeKeys, 
            datasets: [{ 
              data: typeKeys.map(k => typeMap[k].global), 
              backgroundColor: ['#0284c7', '#d97706', '#059669'], 
              borderWidth: 0 
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            cutout: '72%',
            plugins: { 
              centerTextColor,
              centerValueColor,
              legend: { 
                position: 'bottom', 
                labels: { color: textColor, font: { size: 11, weight: 'bold' } }
              },
              tooltip: pieTooltipDesign(typeMap)
            },
            onClick: (e, elements) => {
              if (elements.length > 0) {
                const clickedType = typeKeys[elements[0].index];
                setFilterTab(clickedType);
              }
            }
          }
        };

        const rpMap = {};
        filteredData.forEach(d => { 
          const rpKey = d.rp || 'RP Não Ind.';
          if (!rpMap[rpKey]) rpMap[rpKey] = { global: 0, empenho: 0, repassado: 0, faltaRepassar: 0 };
          rpMap[rpKey].global += d.global;
          rpMap[rpKey].empenho += d.empenho;
          rpMap[rpKey].repassado += d.repassado;
          rpMap[rpKey].faltaRepassar += Math.max(0, d.empenho - d.repassado);
        });

        const rpKeys = Object.keys(rpMap);
        
        const configRp = {
          type: 'doughnut',
          data: { 
            labels: rpKeys, 
            datasets: [{ 
              data: rpKeys.map(k => rpMap[k].global), 
              backgroundColor: ['#db2777', '#d97706', '#059669', '#0891b2', '#7c3aed'], 
              borderWidth: 0 
            }] 
          },
          options: { 
            responsive: true, 
            maintainAspectRatio: false, 
            cutout: '72%',
            plugins: { 
              centerTextColor,
              centerValueColor,
              legend: { position: 'bottom', labels: { color: textColor, font: { size: 11, weight: 'bold' } } },
              tooltip: pieTooltipDesign(rpMap)
            },
            onClick: (e, elements) => {
              if (elements.length > 0) {
                const clickedRp = rpKeys[elements[0].index];
                setFilterRP(clickedRp);
              }
            }
          }
        };

        return {
          uf: { title: "Volume por Estado (Top 10)", config: configUf },
          parlamentar: { title: "Top 5 Parlamentares", config: configParlamentar },
          program: { title: "Top 5 Programas", config: configProgram },
          type: { title: "Por Tipo de Instrumento", config: configType },
          rp: { title: "Por Modalidade (RP)", config: configRp }
        };
      }, [filteredData, isLightMode, isAuthenticated]);

      useEffect(() => {
        if (!isAuthenticated || !chartConfigs.uf) return;

        if (chartUfRef.current) {
          if (instanceUf.current) instanceUf.current.destroy();
          instanceUf.current = new Chart(chartUfRef.current, chartConfigs.uf.config);
        }

        if (chartParlamentarRef.current) {
          if (instanceParlamentar.current) instanceParlamentar.current.destroy();
          instanceParlamentar.current = new Chart(chartParlamentarRef.current, chartConfigs.parlamentar.config);
        }

        if (chartTypeRef.current) {
          if (instanceType.current) instanceType.current.destroy();
          instanceType.current = new Chart(chartTypeRef.current, chartConfigs.type.config);
        }

        if (chartProgramRef.current) {
          if (instanceProgram.current) instanceProgram.current.destroy();
          instanceProgram.current = new Chart(chartProgramRef.current, chartConfigs.program.config);
        }

        if (chartRpRef.current) {
          if (instanceRp.current) instanceRp.current.destroy();
          instanceRp.current = new Chart(chartRpRef.current, chartConfigs.rp.config);
        }
      }, [chartConfigs, isAuthenticated]);

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 bg-blue-600/10 border border-blue-500/30 rounded-2xl flex items-center justify-center mx-auto text-3xl">
                  🔒
                </div>
                <h2 className="text-xl sm:text-2xl font-bold text-white tracking-tight">Acesso Restrito</h2>
                <p className="text-xs text-slate-400">Informe a senha para acessar o Painel de Monitoramento MTur</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Senha de Acesso</label>
                  <input
                    type="password"
                    placeholder="Digite sua senha..."
                    value={passwordInput}
                    onChange={(e) => {
                      setPasswordInput(e.target.value);
                      if (authError) setAuthError(false);
                    }}
                    className={`w-full bg-slate-950 border rounded-xl px-4 py-3 text-sm text-white focus:outline-none transition-all ${
                      authError ? 'border-rose-500 ring-2 ring-rose-500/20' : 'border-slate-800 focus:border-blue-500'
                    }`}
                    autoFocus
                  />
                  {authError && (
                    <p className="text-xs text-rose-500 mt-1 font-semibold">Senha incorreta. Tente novamente.</p>
                  )}
                </div>

                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/30 active:scale-[0.98] disabled:opacity-50"
                >
                  {isLoading ? 'Verificando...' : 'Entrar no Painel'}
                </button>
              </form>

              <div className="text-center text-[10px] text-slate-500 border-t border-slate-800/80 pt-4">
                Ministério do Turismo • Sistema Executivo de Controle
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen p-3 sm:p-6 lg:p-8 space-y-4 sm:space-y-6 transition-colors duration-300 ${isLightMode ? 'bg-slate-100 text-slate-900' : 'bg-slate-950 text-slate-100'} ${presentationMode ? 'p-2' : ''}`}>
          
          {/* HEADER PRINCIPAL */}
          <header className={`flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4 print-card ${isLightMode ? 'border-slate-300' : 'border-slate-800'}`}>
            <div>
              <h1 className="text-xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2 sm:gap-3 flex-wrap">
                Painel de Monitoramento MTur
                {presentationMode && <span className="text-[10px] sm:text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold uppercase animate-pulse">Modo TV / Reunião</span>}
              </h1>
              <p className={`text-xs sm:text-sm mt-0.5 ${isLightMode ? 'text-slate-700 font-medium' : 'text-slate-400'}`}>Visão Executiva de Convênios, Termos de Fomento e TEDs</p>
            </div>

            <div className="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2 sm:gap-3 no-print">
              <button
                onClick={() => setIsLightMode(!isLightMode)}
                className={`px-3 py-2 rounded-xl text-xs font-bold transition-all border flex items-center justify-center gap-1.5 ${isLightMode ? 'bg-white border-slate-300 text-slate-800 hover:bg-slate-50 shadow-sm' : 'bg-slate-900 border-slate-700 text-slate-200 hover:bg-slate-800'}`}
              >
                {isLightMode ? '🌙 Modo Escuro' : '☀️ Modo Claro'}
              </button>

              <button
                onClick={() => window.print()}
                className="px-3 sm:px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all shadow-md flex items-center justify-center gap-1.5"
              >
                📄 PDF
              </button>

              <button
                onClick={() => setPresentationMode(!presentationMode)}
                className={`col-span-2 sm:col-span-1 px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 border ${
                  presentationMode 
                    ? 'bg-indigo-600 border-indigo-500 text-white shadow-lg' 
                    : isLightMode ? 'bg-white border-slate-300 text-slate-800 shadow-sm' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'
                }`}
              >
                🖥️ {presentationMode ? 'Sair Apresentação' : 'Modo Apresentação (TV)'}
              </button>

              {!presentationMode && (
                <label className="col-span-2 sm:col-span-1 cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 sm:px-4 py-2 rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-2">
                  <span className="truncate">📂 {fileName ? `Fonte: ${fileName}` : 'Carregar Excel'}</span>
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
                </label>
              )}

              <button
                onClick={handleLogout}
                title="Sair da Sessão"
                className="col-span-2 sm:col-span-1 px-3 py-2 bg-rose-600/10 border border-rose-500/30 hover:bg-rose-600 text-rose-500 hover:text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1"
              >
                🚪 Sair
              </button>
            </div>
          </header>

          {isLoading ? (
            <div className={`border rounded-3xl p-8 sm:p-12 text-center space-y-4 ${isLightMode ? 'bg-white border-slate-300' : 'bg-slate-900/60 border-slate-800'}`}>
              <div className="text-4xl animate-spin">⏳</div>
              <h2 className="text-lg sm:text-xl font-bold">Carregando dados da planilha...</h2>
            </div>
          ) : data.length === 0 ? (
            <div className={`border-2 border-dashed rounded-3xl p-8 sm:p-12 text-center space-y-4 ${isLightMode ? 'bg-white border-slate-300' : 'bg-slate-900/60 border-slate-800'}`}>
              <div className="text-5xl sm:text-6xl animate-bounce">📊</div>
              <h2 className="text-xl sm:text-2xl font-bold">Nenhuma Planilha Carregada</h2>
              <p className={`text-xs sm:text-sm max-w-md mx-auto ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>
                Envie a planilha de dados pelo botão verde superior para alimentar o painel ou certifique-se de que o arquivo no GitHub se chama <strong>Planilha de Emendas - Resumida.xlsx</strong>.
              </p>
            </div>
          ) : (
            <>
              {/* FILTROS PRINCIPAIS */}
              {!presentationMode && (
                <div className={`border rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl no-print ${isLightMode ? 'bg-white border-slate-300' : 'bg-slate-900 border-slate-800'}`}>
                  <div className={`flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 border-b pb-4 ${isLightMode ? 'border-slate-200' : 'border-slate-700/50'}`}>
                    <div className={`flex p-1 rounded-xl border overflow-x-auto w-full md:w-auto shrink-0 ${isLightMode ? 'bg-slate-100 border-slate-300' : 'bg-slate-950 border-slate-800'}`}>
                      {['ALL', 'Convênio', 'Termo de Fomento', 'TED'].map(tab => (
                        <button
                          key={tab}
                          onClick={() => { setFilterTab(tab); setCurrentPage(1); }}
                          className={`px-3 sm:px-4 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap shrink-0 ${filterTab === tab ? 'bg-blue-600 text-white shadow-lg' : (isLightMode ? 'text-slate-700 hover:text-black font-semibold' : 'text-slate-400 hover:text-white')}`}
                        >
                          {tab === 'ALL' ? 'Todos Instrumentos' : tab}
                        </button>
                      ))}
                    </div>

                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3 w-full md:w-auto">
                      <button
                        onClick={handleResetFilters}
                        className={`px-3 py-2 border rounded-xl text-xs font-bold transition-all whitespace-nowrap ${isLightMode ? 'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'}`}
                      >
                        🔄 Resetar Filtros
                      </button>

                      <input
                        type="text"
                        placeholder="Buscar proponente, objeto, cidade..."
                        value={search}
                        onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }}
                        className={`border rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-blue-500 w-full sm:w-64 font-semibold ${isLightMode ? 'bg-white border-slate-300 text-slate-900' : 'bg-slate-950 border-slate-800 text-white'}`}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-8 gap-2.5 sm:gap-3">
                    <MultiSelectDropdown
                      title="Parlamentar(es)"
                      options={parlamentaresDisponiveis}
                      selectedValues={selectedParlamentares}
                      onChange={(vals) => { setSelectedParlamentares(vals); setCurrentPage(1); }}
                      isLightMode={isLightMode}
                    />

                    <MultiSelectDropdown
                      title="Programa(s)"
                      options={programasDisponiveis}
                      selectedValues={selectedProgramas}
                      onChange={(vals) => { setSelectedProgramas(vals); setCurrentPage(1); }}
                      isLightMode={isLightMode}
                    />

                    <MultiSelectDropdown
                      title="Estado(s) UF"
                      options={ufsDisponiveis}
                      selectedValues={selectedUFs}
                      onChange={(vals) => { setSelectedUFs(vals); setCurrentPage(1); }}
                      isLightMode={isLightMode}
                    />

                    <div>
                      <label className={`text-xs mb-1 block font-bold ${isLightMode ? 'text-slate-800' : 'text-slate-400'}`}>Modalidade (RP)</label>
                      <select value={filterRP} onChange={(e) => { setFilterRP(e.target.value); setCurrentPage(1); }} className={`w-full border rounded-xl px-2.5 py-2 text-xs font-semibold ${isLightMode ? 'bg-white border-slate-300 text-slate-900' : 'bg-slate-950 border-slate-800 text-white'}`}>
                        <option value="ALL">Todas RPs</option>
                        {rpsDisponiveis.map(rp => <option key={rp} value={rp}>{rp}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className={`text-xs font-bold mb-1 block ${isLightMode ? 'text-sky-800' : 'text-sky-500'}`}>Faixa de Valor</label>
                      <select value={filterFaixaValor} onChange={(e) => { setFilterFaixaValor(e.target.value); setCurrentPage(1); }} className={`w-full border rounded-xl px-2.5 py-2 text-xs font-semibold ${isLightMode ? 'bg-white border-sky-300 text-slate-900' : 'bg-slate-950 border-sky-800/80 text-white'}`}>
                        <option value="ALL">Todas Faixas</option>
                        <option value="500K">Até R$ 500 mil</option>
                        <option value="500K_2M">R$ 500k a R$ 2 mi</option>
                        <option value="2M">Acima R$ 2 mi</option>
                      </select>
                    </div>

                    <div>
                      <label className={`text-xs mb-1 block font-bold ${isLightMode ? 'text-slate-800' : 'text-slate-400'}`}>Ano Celebração</label>
                      <select value={filterAno} onChange={(e) => { setFilterAno(e.target.value); setCurrentPage(1); }} className={`w-full border rounded-xl px-2.5 py-2 text-xs font-semibold ${isLightMode ? 'bg-white border-slate-300 text-slate-900' : 'bg-slate-950 border-slate-800 text-white'}`}>
                        <option value="ALL">Todos Anos</option>
                        {anosDisponiveis.map(ano => <option key={ano} value={ano}>{ano}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className={`text-xs font-bold mb-1 block ${isLightMode ? 'text-emerald-800' : 'text-emerald-500'}`}>Ano Repasse</label>
                      <select value={filterAnoRepasse} onChange={(e) => { setFilterAnoRepasse(e.target.value); setCurrentPage(1); }} className={`w-full border rounded-xl px-2.5 py-2 text-xs font-semibold ${isLightMode ? 'bg-white border-emerald-300 text-slate-900' : 'bg-slate-950 border-emerald-800/80 text-white'}`}>
                        <option value="ALL">Todos Pagos</option>
                        {anosRepasseDisponiveis.map(ano => <option key={ano} value={ano}>{ano}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className={`text-xs font-bold mb-1 block ${isLightMode ? 'text-amber-800' : 'text-amber-500'}`}>Vigência</label>
                      <select value={filterVigenciaAlerta} onChange={(e) => { setFilterVigenciaAlerta(e.target.value); setCurrentPage(1); }} className={`w-full border rounded-xl px-2.5 py-2 text-xs font-semibold ${isLightMode ? 'bg-amber-50 border-amber-300 text-slate-900' : 'bg-slate-950 border-amber-800/80 text-white'}`}>
                        <option value="ALL">Todas</option>
                        <option value="ALERTA">🚨 Ano {currentYear}</option>
                        <option value="30">⚠️ Até 30 dias</option>
                        <option value="60">⚠️ Até 60 dias</option>
                        <option value="90">⚠️ Até 90 dias</option>
                      </select>
                    </div>
                  </div>
                </div>
              )}

              {/* TETO ORÇAMENTÁRIO */}
              <div className={`border rounded-2xl p-4 shadow-xl print-card ${isLightMode ? 'bg-gradient-to-r from-sky-50 via-white to-indigo-50 border-sky-300 text-slate-900' : 'bg-gradient-to-r from-sky-950/60 via-slate-900 to-indigo-950/60 border-sky-800/40 text-slate-100'}`}>
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4">
                  <div>
                    <div className={`text-[10px] sm:text-xs font-extrabold uppercase tracking-wider ${isLightMode ? 'text-sky-800' : 'text-sky-500'}`}>
                      Teto Orçamentário MTur ({anoOrcamentoBase})
                    </div>
                    <div className="text-xl sm:text-2xl font-black mt-0.5">
                      {orcamentoAnual > 0 ? fmtR$(orcamentoAnual) : `R$ 0,00 (Sem orçamento base cadastrado)`}
                    </div>
                  </div>

                  <div className="w-full md:w-1/2 space-y-1">
                    <div className="flex justify-between text-xs font-bold">
                      <span>Repassado: {fmtR$(totRepassado)}</span>
                      <span className={`font-black ${isLightMode ? 'text-sky-900' : 'text-sky-500'}`}>{pctOrcamentoComprometido}% Comprometido</span>
                    </div>
                    <div className={`w-full h-2.5 sm:h-3 rounded-full overflow-hidden p-0.5 border ${isLightMode ? 'bg-slate-200 border-slate-300' : 'bg-slate-950 border-slate-800'}`}>
                      <div className="bg-gradient-to-r from-sky-500 to-indigo-500 h-full rounded-full transition-all" style={{ width: `${Math.min(pctOrcamentoComprometido, 100)}%` }}></div>
                    </div>
                    <div className={`text-right text-[10px] sm:text-[11px] font-black ${isLightMode ? 'text-emerald-800' : 'text-emerald-500'}`}>
                      Saldo Disponível: {fmtR$(saldoOrcamentoDisponivel)}
                    </div>
                  </div>
                </div>
              </div>

              {/* CARDS INDICADORES E KPIS */}
              <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-7 gap-2.5 sm:gap-3 print-card">
                <div className={`border rounded-2xl p-3 sm:p-3.5 shadow-lg ${isLightMode ? 'bg-white border-slate-300 text-slate-900' : 'bg-slate-900 border-slate-800'}`}>
                  <div className={`text-[10px] sm:text-[11px] font-extrabold uppercase tracking-wider ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>Volume Global</div>
                  <div className="text-sm sm:text-base font-black mt-1 truncate">{fmtR$(totGlobal)}</div>
                  <div className={`text-[10px] mt-1 font-semibold ${isLightMode ? 'text-slate-600' : 'text-slate-400'}`}>{filteredData.length} registros</div>
                </div>

                <div 
                  onClick={() => { 
                    setFilterEmpenhados(!filterEmpenhados); 
                    setFilterFaltaRepassar(false); 
                    setFilterRepassados(false); 
                    setFilterNaoEmpenhados(false);
                    setCurrentPage(1); 
                  }}
                  className={`border rounded-2xl p-3 sm:p-3.5 shadow-lg hover:shadow-xl transition-all cursor-pointer hover:scale-[1.02] ${filterEmpenhados ? 'ring-2 ring-amber-500' : ''} ${isLightMode ? 'bg-amber-50/70 border-amber-300 hover:bg-amber-100/80' : 'bg-amber-950/20 border-amber-900/40 hover:bg-amber-950/40'}`}
                >
                  <div className={`text-[10px] sm:text-[11px] font-black uppercase tracking-wider flex items-center justify-between ${isLightMode ? 'text-amber-900' : 'text-amber-500'}`}>
                    <span>Empenhado</span>
                    {filterEmpenhados && <span className="text-[9px] bg-amber-500 text-black px-1 py-0.2 rounded font-black">Ativo</span>}
                  </div>
                  <div className={`text-sm sm:text-base font-black mt-1 truncate ${isLightMode ? 'text-amber-950' : 'text-amber-500'}`}>{fmtR$(totEmpenho)}</div>
                  <div className="text-[9px] sm:text-[10px] mt-1 flex justify-between items-center font-semibold">
                    <span className={isLightMode ? 'text-slate-700' : 'text-slate-400'}>Válidos</span>
                    <span className={`font-black ${isLightMode ? 'text-amber-900' : 'text-amber-400'}`}>Filtrar 🔍</span>
                  </div>
                </div>

                <div 
                  onClick={() => { 
                    setFilterNaoEmpenhados(!filterNaoEmpenhados); 
                    setFilterEmpenhados(false); 
                    setFilterFaltaRepassar(false); 
                    setFilterRepassados(false); 
                    setCurrentPage(1); 
                  }}

                            </td>
                            <td className={`p-3 text-center font-extrabold whitespace-nowrap ${isLightMode ? 'text-amber-900' : 'text-amber-400'}`}>{item.parlamentar}</td>
                            <td className={`p-3 text-center font-black ${isLightMode ? 'text-slate-900' : 'text-white'}`}>{item.uf}</td>
                            <td className={`p-3 text-center font-bold whitespace-nowrap ${isLightMode ? 'text-sky-900' : 'text-sky-300'}`}>{item.cidadeSede}</td>
                            <td className={`p-3 text-center whitespace-nowrap print-hide-col font-bold ${isLightMode ? 'text-slate-800' : 'text-slate-200'}`}>{item.inicioVigencia}</td>
                            <td className="p-3 text-center whitespace-nowrap">
                              <div className={`font-black ${isLightMode ? 'text-slate-900' : 'text-white'}`}>{item.fimVigencia}</div>
                              <div className="mt-0.5">
                                <span className={`text-[9px] px-2 py-0.5 rounded-full font-black uppercase ${risk.badgeBg}`}>
                                  {risk.icon} {risk.label}
                                </span>
                              </div>
                            </td>
                            <td className={`p-3 text-right font-extrabold whitespace-nowrap ${isLightMode ? 'text-slate-900' : 'text-white'}`}>{fmtR$(item.global)}</td>
                            <td className={`p-3 text-right font-extrabold whitespace-nowrap ${isLightMode ? 'text-amber-900' : 'text-amber-500'}`}>
                              {item.instrumento === 'TED' ? <span className={`text-[10px] font-black ${isLightMode ? 'text-blue-900' : 'text-blue-500'}`}>N/A (TED)</span> : fmtR$(item.empenho)}
                            </td>
                            <td className={`p-3 text-right font-black whitespace-nowrap ${
                              item.repassado > 0 
                                ? (isLightMode ? 'text-emerald-800' : 'text-emerald-500') 
                                : (isLightMode ? 'text-rose-800' : 'text-rose-500')
                            }`}>
                              {fmtR$(item.repassado)}
                            </td>
                            <td className={`p-3 whitespace-normal break-words min-w-[200px] max-w-xs font-semibold ${isLightMode ? 'text-slate-800' : 'text-slate-300'}`}>{item.obs}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>

                {/* PAGINAÇÃO */}
                <div className={`p-4 border-t flex flex-col sm:flex-row items-center justify-between gap-3 no-print ${isLightMode ? 'border-slate-300 bg-slate-50' : 'border-slate-800'}`}>
                  <div className={`text-xs font-bold ${isLightMode ? 'text-slate-700' : 'text-slate-400'}`}>
                    Página <span className={`font-black ${isLightMode ? 'text-blue-900' : 'text-blue-500'}`}>{currentPage}</span> de <span className={`font-black ${isLightMode ? 'text-blue-900' : 'text-blue-500'}`}>{totalPages}</span>
                  </div>

                  <div className="flex items-center gap-1.5 sm:gap-2 w-full sm:w-auto justify-center">
                    <button
                      disabled={currentPage === 1}
                      onClick={() => setCurrentPage(1)}
                      className={`px-2 sm:px-2.5 py-1 text-xs font-bold rounded-lg disabled:opacity-40 ${isLightMode ? 'bg-slate-200 text-slate-800 hover:bg-slate-300 border border-slate-300' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}
                    >
                      «
                    </button>
                    <button
                      disabled={currentPage === 1}
                      onClick={() => setCurrentPage(prev => Math.max(1, prev - 1))}
                      className={`px-2.5 sm:px-3 py-1 text-xs font-bold rounded-lg disabled:opacity-40 ${isLightMode ? 'bg-slate-200 text-slate-800 hover:bg-slate-300 border border-slate-300' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}
                    >
                      ‹ Ant.
                    </button>
                    <button
                      disabled={currentPage === totalPages}
                      onClick={() => setCurrentPage(prev => Math.min(totalPages, prev + 1))}
                      className={`px-2.5 sm:px-3 py-1 text-xs font-bold rounded-lg disabled:opacity-40 ${isLightMode ? 'bg-slate-200 text-slate-800 hover:bg-slate-300 border border-slate-300' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}
                    >
                      Próx. ›
                    </button>
                    <button
                      disabled={currentPage === totalPages}
                      onClick={() => setCurrentPage(totalPages)}
                      className={`px-2 sm:px-2.5 py-1 text-xs font-bold rounded-lg disabled:opacity-40 ${isLightMode ? 'bg-slate-200 text-slate-800 hover:bg-slate-300 border border-slate-300' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}`}
                    >
                      »
                    </button>
                  </div>
                </div>
              </div>
            </>
          )}

          {/* MODAL DE GRÁFICOS EXPANDIDOS */}
          {expandedItem && (
            <ExpandedChartModal
              title={expandedItem.title}
              chartConfig={expandedItem.chartConfig}
              isMap={expandedItem.isMap}
              mapProps={expandedItem.mapProps}
              onClose={() => setExpandedItem(null)}
              isLightMode={isLightMode}
            />
          )}

          {/* FICHA EXECUTIVA */}
          {selectedInstrument && (
            <InstrumentDetailModal
              item={selectedInstrument}
              onClose={() => setSelectedInstrument(null)}
              isLightMode={isLightMode}
              riskStatus={getRiskStatus(selectedInstrument)}
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
